# Глобальне правило дозволяє публічний доступ, якщо не вказано інше
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } }

type Employee @model @auth(rules: [{ allow: public }]) {
    id: ID!
    name: String! @index(name: "byName", queryField: "employeesByName")
    isFavourite: String @index(name: "byFavourite", queryField: "employeesByFavourite")
    position: String!
}
